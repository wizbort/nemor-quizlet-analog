name = "nemor-cards"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# The Worker serves the Expo web export as Static Assets with SPA fallback.
# Run `npm run build:web` (at repo root) to populate ../app/dist before deploy.
[assets]
directory = "../app/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Cloudflare Workers AI — used for PDF -> Markdown via AI.toMarkdown().
[ai]
binding = "AI"

# D1 (source of truth).
# FIRST-TIME SETUP:
#   1. Run:  npx wrangler d1 create nemor-cards
#   2. Copy the returned `database_id` and paste it below, replacing
#      REPLACE_WITH_YOUR_D1_ID.
#   3. Initialize the schema:  npm run db:init        (local)
#                              npm run db:init:remote (remote/production)
[[d1_databases]]
binding = "DB"
database_name = "nemor-cards"
database_id = "REPLACE_WITH_YOUR_D1_ID"

# Public (non-secret) vars. Secrets AUTH_API_KEY and OPENROUTER_PROXY_KEY are
# NOT here — set them via `wrangler secret put <NAME>` (production) or .dev.vars
# (local). See .dev.vars.example.
[vars]
AUTH_API_BASE_URL = "https://api-auth.alrevion.workers.dev"
OPENROUTER_PROXY_URL = "https://openrouter-proxy.dsfddff31.workers.dev"
LLM_MODELS = "nvidia/nemotron-3-ultra-550b-a55b:free,nvidia/nemotron-3-super-120b-a12b:free,openai/gpt-oss-120b:free,google/gemma-4-31b-it:free"
